Name: Build APK
On: [push]
Jobs: Build: Runs-on: Ubuntu-latest Steps: 
- uses: Actions/checkout@v4 
- name: Install Java run: sudo apt-get update && sudo apt-get install -y openjdk-17-jdk 
- name: Install Buildozer run: Pip install buildozer 
- name: Build APK run: buildozer -v android debug 
- name: Upload APK uses: Actions/upload-artifact@v4 with: 
Name: package Path: Output/*.apk
